name: niasheritage
description: "A curated digital repository dedicated to showcasing the rich history, oral traditions, cultural artifacts, literature, and language of Nias Island"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.34.2
  path_provider: ^2.1.6
  path: ^1.9.1
  easy_localization: ^3.0.8
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5
  http: ^1.2.0
  url_launcher: ^6.3.0
  html: ^0.15.4
  flutter_markdown_plus: ^1.0.12
  wiki_course_reader:
    git:
      url: https://github.com/sslaia/wiki_community_modules.git
      path: packages/wiki_course_reader
  wiki_newsletter_reader:
    git:
      url: https://github.com/sslaia/wiki_community_modules.git
      path: packages/wiki_newsletter_reader
  wiki_media_gallery:
    git:
      url: https://github.com/sslaia/wiki_community_modules.git
      path: packages/wiki_media_gallery
  wiki_crosswords:
    git:
      url: https://github.com/sslaia/wiki_community_modules.git
      path: packages/wiki_crosswords
  flutter_widget_from_html: ^0.17.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.4
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/
    - assets/niasheritage.sqlite
    - assets/data/

dependency_overrides:
  wiki_crosswords:
    path: ../wiki_community_modules/packages/wiki_crosswords
  wiki_media_gallery:
    path: ../wiki_community_modules/packages/wiki_media_gallery
  wiki_course_reader:
    path: ../wiki_community_modules/packages/wiki_course_reader
  wiki_newsletter_reader:
    path: ../wiki_community_modules/packages/wiki_newsletter_reader

